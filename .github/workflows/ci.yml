name: CPOS CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend dependency, test, and syntax checks
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cpos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: cpos_test
      JWT_SECRET: test_jwt_secret_key_12345
      NODE_ENV: test
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Wait for MySQL readiness
        run: |
          for i in {1..30}; do
            if command -v mysqladmin >/dev/null 2>&1; then
              mysqladmin ping -h127.0.0.1 -uroot -proot >/dev/null 2>&1 && break
            fi
            sleep 1
          done
          if command -v mysql >/dev/null 2>&1; then
            mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS cpos_test;"
          fi

      - name: Run backend tests when a test script exists
        run: npm test --if-present

      - name: Check JavaScript syntax
        run: find . -maxdepth 3 -not -path '*/node_modules/*' -name '*.js' -print0 | xargs -0 -r -n1 node --check

